<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LofiSu — zsh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Silkscreen:wght@400&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────────
   两套：和纸白（昼） / 夜墨（夜）
   深色不是反色——墨底、月白字、苔色提亮，层次重新配过
   字体：Silkscreen(窗口栏位图字) + IBM Plex Mono Light(正文)
   节奏：呼吸 5–9s 缓动，无跳帧
   ──────────────────────────────────────────────────────────── */
:root{
  /* 昼 · 和纸 */
  --paper:#f7f5f0;
  --paper-2:#efece4;
  --paper-3:#e6e2d8;
  --ink:#33312c;
  --ink-2:#6b675d;
  --ink-3:#a09b8e;
  --rule:#dbd6c9;
  --rule-2:#c9c3b3;
  --moss:#5f7050;        /* 苔：昼稍深，保证对比 */
  --moss-soft:#e8ebe2;
  --desk:#ded9cd;
  --desk-line:rgba(51,49,44,.05);
  --face:#e6e2d8;
  --face-ink:#33312c;
  --stripe:rgba(51,49,44,.07);
  --sheen:rgba(255,255,255,.5);
  --shadow-1:#33312c;
  --shadow-2:#c9c3b3;
  /* 画中景 */
  --art-bg:#efece4;
  --art-far:#dbd6c9;
  --art-near:#a09b8e;
  --art-water:#c9c3b3;
  --art-glow:#5f7050;
  --art-ink:#33312c;
  color-scheme:light;
}

/* ── 夜 · 夜墨 ── */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161815;
    --paper-2:#1e211c;
    --paper-3:#262a23;
    --ink:#e6e3d8;      /* 月白 */
    --ink-2:#a3a396;
    --ink-3:#6e7065;
    --rule:#2b2f28;
    --rule-2:#3c4137;
    --moss:#a3b585;     /* 月下苔：提亮才立得住 */
    --moss-soft:#262b21;
    --desk:#0e100d;
    --desk-line:rgba(230,227,216,.04);
    --face:#24271f;
    --face-ink:#d9d6cb;
    --stripe:rgba(230,227,216,.055);
    --sheen:rgba(230,227,216,.035);
    --shadow-1:rgba(0,0,0,.62);
    --shadow-2:rgba(0,0,0,.36);
    --art-bg:#1e211c;
    --art-far:#33382e;
    --art-near:#5d6255;
    --art-water:#454a3e;
    --art-glow:#a3b585;
    --art-ink:#e6e3d8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161815;
  --paper-2:#1e211c;
  --paper-3:#262a23;
  --ink:#e6e3d8;
  --ink-2:#a3a396;
  --ink-3:#6e7065;
  --rule:#2b2f28;
  --rule-2:#3c4137;
  --moss:#a3b585;
  --moss-soft:#262b21;
  --desk:#0e100d;
  --desk-line:rgba(230,227,216,.04);
  --face:#24271f;
  --face-ink:#d9d6cb;
  --stripe:rgba(230,227,216,.055);
  --sheen:rgba(230,227,216,.035);
  --shadow-1:rgba(0,0,0,.62);
  --shadow-2:rgba(0,0,0,.36);
  --art-bg:#1e211c;
  --art-far:#33382e;
  --art-near:#5d6255;
  --art-water:#454a3e;
  --art-glow:#a3b585;
  --art-ink:#e6e3d8;
  color-scheme:dark;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  font-weight:400;
  font-size:13px;line-height:1.75;
  background:var(--desk);
  background-image:
    linear-gradient(var(--desk-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--desk-line) 1px,transparent 1px);
  background-size:6px 6px;
  color:var(--ink);
  min-height:100vh;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  overflow-x:hidden;
  transition:background-color .8s ease,color .8s ease;
}
a{color:inherit;text-decoration:none}
img,svg{image-rendering:pixelated;shape-rendering:crispEdges}
::selection{background:var(--moss-soft);color:var(--ink)}

/* ══ 窗口 ══ */
.win{
  width:100%;max-width:1000px;margin:3vh auto 0;
  background:var(--paper);
  border:1px solid var(--ink);
  box-shadow:1px 1px 0 var(--shadow-1),2px 2px 0 var(--shadow-2);
  position:relative;
  transition:background-color .8s ease,border-color .8s ease,box-shadow .8s ease;
}
@media (prefers-reduced-motion:no-preference){
  .win{animation:settle .9s cubic-bezier(.16,.84,.3,1) both}
  @keyframes settle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}

/* ══ 标题栏 ══ */
.titlebar{
  display:flex;align-items:center;gap:8px;
  height:26px;padding:0 8px;
  background:var(--face);
  border-bottom:1px solid var(--ink);
  user-select:none;position:relative;
  transition:background-color .8s ease;
}
.titlebar::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 3px,var(--stripe) 3px 4px);
}
.tb-box{
  width:13px;height:13px;flex-shrink:0;position:relative;z-index:1;
  border:1px solid var(--ink);background:var(--paper);
  cursor:pointer;transition:background .4s ease;
}
.tb-box:hover{background:var(--moss-soft)}
.tb-box::after{
  content:'';position:absolute;inset:2px;background:var(--ink);
  opacity:.5;transition:opacity .4s ease;
}
.tb-box:hover::after{opacity:.85}
/* 主题钮：半明半暗的小方块 */
.tb-theme{
  width:13px;height:13px;flex-shrink:0;position:relative;z-index:1;
  border:1px solid var(--ink);cursor:pointer;overflow:hidden;
  background:linear-gradient(90deg,var(--paper) 0 50%,var(--ink) 50% 100%);
  transition:filter .4s ease;
}
.tb-theme:hover{filter:brightness(1.25)}
.tb-title{
  flex:1;min-width:0;text-align:center;position:relative;z-index:1;
  font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:.04em;
  color:var(--face-ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:1px 10px;
  background:var(--paper-2);
  border:1px solid var(--ink);
  margin:0 10px;
  transition:background-color .8s ease,color .8s ease;
}
.tb-right{display:flex;gap:5px;flex-shrink:0;position:relative;z-index:1}
.tb-z{
  width:13px;height:9px;border:1px solid var(--ink);
  background:var(--paper);cursor:pointer;transition:background .4s ease;
}
.tb-z:hover{background:var(--paper-3)}

/* ══ 终端体 ══ */
.screen{
  position:relative;
  padding:28px 30px 26px;
  min-height:58vh;
  background:var(--paper);
  transition:background-color .8s ease;
}
.screen::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse 90% 70% at 50% 0%,var(--sheen),transparent 70%);
}
.screen-in{position:relative;z-index:1}

/* ══ 行 ══ */
.ln{margin-bottom:1px;white-space:pre-wrap;word-break:break-word}
.ps1{color:var(--moss);transition:color .8s ease}
.ps1 .host{color:var(--ink-2)}
.ps1 .sym{color:var(--ink-3)}
.cmd{color:var(--ink)}

.out{padding-left:0}
.o-ink{color:var(--ink)}
.o-dim{color:var(--ink-2)}
.o-faint{color:var(--ink-3)}
.o-moss{color:var(--moss)}

/* ══ 头部 ══ */
.head{
  display:flex;gap:24px;align-items:flex-start;
  padding:6px 0 20px;flex-wrap:wrap;
}
.face{
  width:76px;height:76px;flex-shrink:0;
  border:1px solid var(--ink);
  background:var(--paper-2);
  position:relative;overflow:hidden;
  transition:background-color .8s ease,border-color .8s ease;
}
.face svg{width:100%;height:100%;display:block}
/* 日 / 月 交叉淡入：默认昼＝日，夜＝月 */
.art-day  {opacity:1;transition:opacity .8s ease}
.art-night{opacity:0;transition:opacity .8s ease}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .art-day  {opacity:0}
  :root:not([data-theme="light"]) .art-night{opacity:1}
}
:root[data-theme="dark"] .art-day  {opacity:0}
:root[data-theme="dark"] .art-night{opacity:1}
:root[data-theme="light"] .art-day  {opacity:1}
:root[data-theme="light"] .art-night{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .face{animation:breathe 9s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.9}50%{opacity:1}}
}
.head-meta{flex:1;min-width:230px;padding-top:2px}
.head-name{
  font-family:'Silkscreen',monospace;font-size:13px;
  color:var(--ink);letter-spacing:.02em;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin-bottom:12px;
}
.head-name .at{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);font-weight:400}
.head-line{color:var(--ink-2);font-size:12.5px;line-height:1.8}
.head-line b{color:var(--ink);font-weight:500}
.head-line .hl{color:var(--moss)}

/* ══ 区块 ══ */
.sec{margin-top:4px}
.sec-h{
  font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:.08em;
  color:var(--ink-3);
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
}
.sec-h::after{content:'';flex:1;height:1px;background:var(--rule)}

/* ══ 列表 ══ */
.list{margin-top:2px}
.item{
  display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;
  padding:9px 6px;
  border-bottom:1px solid var(--rule);
  transition:background .45s ease,transform .45s ease;
}
a.item:hover{background:var(--paper-2);transform:translateX(2px)}
a.item:hover .nm{color:var(--moss)}
.nm{color:var(--ink);font-weight:500;transition:color .45s ease}
.nm::before{content:'▸ ';color:var(--ink-3)}
.nm .star{color:var(--ink-2);font-weight:400}
.ds{color:var(--ink-2);font-size:12.5px;display:block;padding-left:16px;margin-top:3px;line-height:1.7}
.item-r{display:flex;align-items:baseline;gap:14px;color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.tag{
  border:1px solid var(--rule-2);padding:1px 7px;
  font-family:'Silkscreen',monospace;font-size:8px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-2);
}
.tag.m{border-color:var(--moss);color:var(--moss)}
@media (max-width:560px){
  .item{grid-template-columns:1fr}
  .item-r{padding-left:16px}
}

/* ══ 经历树 ══ */
.node{
  display:grid;grid-template-columns:1fr auto;gap:14px;
  padding:8px 6px;border-bottom:1px solid var(--rule);
}
.node:last-child{border-bottom:0}
.node-co{color:var(--ink);font-weight:500}
.node-co::before{content:'│ ';color:var(--rule-2);font-weight:400}
.node-role{color:var(--ink-2);font-size:12.5px;padding-left:16px;line-height:1.7}
.node-role em{font-style:normal;color:var(--moss)}
.node-when{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
@media (max-width:560px){.node{grid-template-columns:1fr}.node-when{padding-left:16px}}

/* ══ 字符方块条 ══ */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:100px 1fr 44px;gap:12px;align-items:center;font-size:12px}
.bar-name{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{display:flex;gap:3px;height:11px}
.bar-track i{flex:1;background:var(--rule);display:block;transition:background-color .8s ease}
.bar-track i.on{background:var(--ink-2)}
.bar-track i.on.alt{background:var(--moss)}
.bar-pct{color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){
  .bar-row{grid-template-columns:1fr auto}
  .bar-name{grid-column:1/-1}
}

/* ══ 联系 ══ */
.links{display:flex;flex-wrap:wrap;gap:8px 22px}
.lk{color:var(--moss);border-bottom:1px solid var(--rule-2);transition:border-color .45s ease}
.lk:hover{border-bottom-color:var(--moss)}
.lk::before{content:'→ ';color:var(--ink-3)}

/* ══ 输入行 ══ */
.input-line{
  display:flex;align-items:center;gap:9px;
  margin-top:20px;padding-top:16px;border-top:1px solid var(--rule);
}
.ps1-fixed{flex-shrink:0}
#cmd{
  flex:1;min-width:0;
  background:transparent;border:0;outline:0;
  font-family:inherit;font-size:13px;font-weight:400;color:var(--ink);
  caret-color:var(--moss);
  padding:2px 0;
}
#cmd::placeholder{color:var(--ink-3)}
.caret{
  width:7px;height:15px;background:var(--moss);flex-shrink:0;
  animation:blink 1.6s ease-in-out infinite;
}
@keyframes blink{0%,45%{opacity:1}55%,100%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.caret{animation:none;opacity:.7}}

/* ══ 快捷命令 ══ */
.hints{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hint{
  font-family:inherit;font-size:11px;font-weight:400;
  background:transparent;border:1px solid var(--rule-2);
  color:var(--ink-2);padding:3px 11px;cursor:pointer;
  transition:all .45s ease;
}
.hint:hover{border-color:var(--moss);color:var(--moss);background:var(--moss-soft)}
.hint:focus-visible{outline:1px solid var(--moss);outline-offset:2px}

/* ══ 状态行 ══ */
.status{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:7px 12px;
  background:var(--face);color:var(--face-ink);
  border-top:1px solid var(--ink);
  font-family:'Silkscreen',monospace;font-size:8px;letter-spacing:.04em;
  position:relative;
  transition:background-color .8s ease,color .8s ease;
}
.status::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 3px,var(--stripe) 3px 4px);
}
.status .sp{flex:1}
.status span{position:relative;z-index:1}
.status .dot{
  width:6px;height:6px;background:var(--moss);
  display:inline-block;margin-right:6px;vertical-align:middle;border-radius:50%;
}

/* ══ 石灯笼 ══ */
.lantern{
  position:fixed;right:max(18px,env(safe-area-inset-right,0px));
  bottom:max(18px,env(safe-area-inset-bottom,0px));
  width:44px;height:44px;z-index:60;
  cursor:pointer;border:0;background:none;padding:0;
  opacity:.5;transition:opacity .6s ease;
}
.lantern:hover{opacity:.95}
.lantern:focus-visible{outline:1px solid var(--moss);outline-offset:3px}
.lantern svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){
  .lantern{animation:sway 7s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
  .lantern .glow{animation:flicker 5s ease-in-out infinite}
  @keyframes flicker{0%,100%{opacity:.35}50%{opacity:.8}}
}

/* ══ 一炷香（阅读进度）══ */
.incense{
  position:fixed;left:max(18px,env(safe-area-inset-left,0px));
  top:0;bottom:0;width:1px;z-index:55;
  background:var(--rule);
  pointer-events:none;
  transition:background-color .8s ease;
}
.incense i{
  display:block;width:100%;height:0%;
  background:var(--moss);
  transition:height .3s linear;
}

/* ══ 提示气泡 ══ */
.bubble{
  position:fixed;z-index:61;
  font-family:'Silkscreen',monospace;font-size:8px;letter-spacing:.04em;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--ink);
  padding:5px 9px;
  box-shadow:2px 2px 0 var(--shadow-2);
  pointer-events:none;
  opacity:0;transform:translateY(3px);
  transition:opacity .6s ease,transform .6s ease;
  max-width:78vw;
}
.bubble.on{opacity:1;transform:none}

/* ══ toast ══ */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  transform:translateX(-50%) translateY(6px);
  z-index:80;opacity:0;pointer-events:none;
  font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:.04em;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--ink);padding:8px 16px;
  box-shadow:2px 2px 0 var(--shadow-2);
  transition:opacity .6s ease,transform .6s ease;
  max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ══ 静默模式 ══ */
body.quiet .status,
body.quiet .hints,
body.quiet .incense{opacity:0;visibility:hidden}
body.quiet .screen{padding-bottom:56px}
.status,.hints,.incense{transition:opacity .9s ease,visibility .9s,background-color .8s ease}
</style>
</head>
<body>

<div class="incense" aria-hidden="true"><i id="incenseBar"></i></div>

<div class="win" id="win">
  <div class="titlebar">
    <span class="tb-box" id="tbBox" title="静默模式 (S)"></span>
    <span class="tb-theme" id="tbTheme" title="切换昼夜 (T)"></span>
    <span class="tb-title" id="tbTitle">▢ LofiSu — -zsh — 96×24</span>
    <span class="tb-right">
      <span class="tb-z" id="tbTop" title="回到顶部"></span>
      <span class="tb-z" id="tbBot" title="到底部"></span>
    </span>
  </div>

  <div class="screen" id="screen">
    <div class="screen-in" id="feed">

      <div class="ln"><span class="ps1">LofiSu@<span class="host">macbook</span><span class="sym">:~$</span></span> <span class="cmd">whoami</span></div>

      <div class="head">
        <div class="face" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <rect width="16" height="16" fill="var(--art-bg)"/>
            <!-- 日：本体同月，另加四道光 -->
            <g class="art-day" fill="var(--art-ink)">
              <rect x="3" y="3" width="5" height="1"/>
              <rect x="3" y="4" width="5" height="1"/>
              <rect x="3" y="5" width="5" height="1"/>
              <rect x="3" y="6" width="5" height="1"/>
              <rect x="3" y="7" width="5" height="1"/>
              <rect x="5" y="1" width="1" height="2"/>
              <rect x="5" y="8" width="1" height="2"/>
              <rect x="1" y="5" width="2" height="1"/>
              <rect x="8" y="5" width="2" height="1"/>
            </g>
            <!-- 月：同一本体，去掉光 -->
            <g class="art-night" fill="var(--art-ink)">
              <rect x="3" y="3" width="5" height="1"/>
              <rect x="3" y="4" width="5" height="1"/>
              <rect x="3" y="5" width="5" height="1"/>
              <rect x="3" y="6" width="5" height="1"/>
              <rect x="3" y="7" width="5" height="1"/>
            </g>
            <!-- 远景山 -->
            <g fill="var(--art-far)">
              <rect x="11" y="9" width="3" height="1"/>
              <rect x="9" y="10" width="6" height="1"/>
              <rect x="10" y="11" width="5" height="1"/>
            </g>
            <!-- 近景苔 -->
            <g fill="var(--art-glow)">
              <rect x="3" y="11" width="1" height="1"/>
              <rect x="5" y="11" width="1" height="1"/>
            </g>
            <!-- 一线水 -->
            <g fill="var(--art-water)">
              <rect x="0" y="12" width="16" height="1"/>
              <rect x="1" y="14" width="14" height="1"/>
            </g>
          </svg>
        </div>
        <div class="head-meta">
          <div class="head-name">LofiSu <span class="at">@LofiSu</span></div>
          <div class="head-bio">
            <div class="head-line">载入中…</div>
          </div>
        </div>
      </div>
    </div>

    <div class="input-line">
      <span class="ps1 ps1-fixed">LofiSu@<span class="host">macbook</span><span class="sym">:~$</span></span>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="输入命令    help 查看全部    T 昼夜    S 静默" aria-label="命令输入">
      <span class="caret" aria-hidden="true"></span>
    </div>

    <div class="hints" id="hints">
      <button class="hint" data-cmd="help">help</button>
      <button class="hint" data-cmd="ls projects">ls projects</button>
      <button class="hint" data-cmd="cat experience">cat experience</button>
      <button class="hint" data-cmd="cat oss">cat oss</button>
      <button class="hint" data-cmd="tokei">tokei</button>
      <button class="hint" data-cmd="contact">contact</button>
      <button class="hint" data-cmd="clear">clear</button>
    </div>
  </div>

  <div class="status">
    <span><span class="dot"></span>zsh</span>
    <span id="stCmd">ready</span>
    <span class="sp"></span>
    <span id="stRight">载入中…</span>
    <span id="stMode">夜</span>
  </div>
</div>

<button class="lantern" id="lantern" aria-label="石灯笼，点一下">
  <svg viewBox="0 0 16 16">
    <g fill="var(--ink)"><rect x="7" y="0" width="2" height="1"/><rect x="6" y="1" width="4" height="1"/></g>
    <g fill="var(--art-near)">
      <rect x="4" y="2" width="8" height="1"/>
      <rect x="3" y="3" width="10" height="1"/>
      <rect x="2" y="4" width="12" height="1"/>
    </g>
    <g fill="var(--art-far)"><rect x="4" y="5" width="8" height="4"/></g>
    <g class="glow" fill="var(--art-glow)"><rect x="6" y="6" width="4" height="2"/></g>
    <g fill="var(--art-near)"><rect x="7" y="9" width="2" height="4"/></g>
    <g fill="var(--ink)"><rect x="5" y="13" width="6" height="1"/><rect x="4" y="14" width="8" height="1"/></g>
  </svg>
</button>

<div class="bubble" id="bubble"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var root    = document.documentElement;
  var feed    = document.getElementById('feed');
  var input   = document.getElementById('cmd');
  var screenEl= document.getElementById('screen');
  var status  = document.getElementById('stCmd');
  var stMode  = document.getElementById('stMode');
  var toastEl = document.getElementById('toast');
  var bubble  = document.getElementById('bubble');
  var bar     = document.getElementById('incenseBar');
  var reduce  = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mqDark  = matchMedia('(prefers-color-scheme: dark)');

  var PS1 = '<span class="ps1">LofiSu@<span class="host">macbook</span><span class="sym">:~$</span></span> ';

  /* ══ 昼夜 ══ */
  var DAYNAME = { light:'昼', dark:'夜' };
  try{ var saved = localStorage.getItem('theme'); if(saved==='light'||saved==='dark') root.setAttribute('data-theme', saved); }catch(e){}
  function mode(){ return root.getAttribute('data-theme') || (mqDark.matches ? 'dark' : 'light'); }
  function paintMode(){ stMode.textContent = DAYNAME[mode()]; }
  function setMode(m, announce){
    root.setAttribute('data-theme', m);
    try{ localStorage.setItem('theme', m); }catch(e){}
    paintMode();
    if(announce) text(m === 'dark' ? '○ 夜 · 墨底月白' : '○ 昼 · 和纸墨字');
  }
  function toggleMode(){ setMode(mode() === 'dark' ? 'light' : 'dark', true); }
  mqDark.addEventListener('change', paintMode);
  paintMode();

  /* ══ 输出 ══ */
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function push(html){
    var d = document.createElement('div');
    d.className = 'ln';
    d.innerHTML = html;
    feed.appendChild(d);
    return d;
  }
  function echo(cmd){ push(PS1 + '<span class="cmd">' + esc(cmd) + '</span>'); }
  function out(html){ push('<span class="out">' + html + '</span>'); }
  function blank(){ push('&nbsp;'); }

  function paint(t){
    return t.split('\n').map(function(l){
      var s = esc(l);
      if(/^●/.test(l)) return '<span class="o-ink">' + s + '</span>';
      if(/^○/.test(l)) return '<span class="o-moss">' + s + '</span>';
      if(/^[～#]/.test(l)) return '<span class="o-faint">' + s + '</span>';
      return '<span class="o-dim">' + s + '</span>';
    }).join('\n');
  }
  function text(t){ out(paint(t).replace(/\n/g,'<br>')); }

  /* ══ 内容：全部来自 data.json ══ */
  var REPOS = [], EXP = [], OSS = [], LANGS = [], LINKS = [], P = {};

  function esc2(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  }); }

  /* 用 JSON 填头部文字与各区块数据 */
  function fill(d){
    P = d.profile || {};
    REPOS = d.repos || [];
    EXP   = d.experience || [];
    OSS   = d.oss || [];
    LANGS = d.langs || [];
    LINKS = d.links || [];

    var set = function(sel, html){ var el = document.querySelector(sel); if(el) el.innerHTML = html; };

    if(P.windowTitle) { var t = document.getElementById('tbTitle'); if(t) t.textContent = P.windowTitle; }
    if(P.host){ var h = document.querySelectorAll('.ps1 .host'); for(var i=0;i<h.length;i++) h[i].textContent = P.host; }

    var nm = document.querySelector('.head-name');
    if(nm) nm.innerHTML = esc2(P.name || '') + ' <span class="at">' + esc2(P.handle || '') + '</span>';

    var bios = P.bio || [];
    var bioBox = document.querySelector('.head-bio');
    if(bioBox){
      bioBox.innerHTML = bios.map(function(l, i){
        var last = (i === bios.length - 1);
        return '<div class="head-line"' + (last ? '' : '') + '>' + l + '</div>';
      }).join('') + (P.stats ? '<div class="head-line" style="margin-top:10px">' + P.stats + '</div>' : '');
    }

    if(P.placeholder){ var inp = document.getElementById('cmd'); if(inp) inp.placeholder = P.placeholder; }
    set('#stRight', esc2(P.statusRight || ''));

    var words = P.spirit;
    if(words && words.length){ WORDS = words; }
  }

  /* 载入。file:// 下会被浏览器拦，给一条明确提示 */
  function boot(){
    return fetch('data.json', {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(d){ fill(d); return true; })
      .catch(function(err){
        var isFile = location.protocol === 'file:';
        text([
          '● 内容没读进来：' + (err && err.message ? err.message : '未知错误'),
          '～',
          isFile
            ? '· 你是直接双击打开的吧。浏览器不允许 file:// 页面读取 data.json（跨源限制）。'
            : '· data.json 和 index.html 要在同一层目录，且文件名必须是小写 data.json。',
          isFile
            ? '· 双击目录里的 serve.bat 就能正常显示；或者用 VS Code 的 Live Server 打开。'
            : '· 刷新重试一次。'
        ].join('\n'));
        blank();
        screenEl.scrollIntoView({block:'end'});
        return false;
      });
  }

  var _FALLBACK = null;
  var WORDS = ['静','一息','山不语','水自流','松风','无事','余白','間','月','夜長'];

  function renderRepos(){
    var w = document.createElement('div'); w.className = 'list';
    REPOS.forEach(function(r){
      var a = document.createElement('a');
      a.className = 'item';
      a.href = 'https://github.com/LofiSu/' + r[0];
      a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<span><span class="nm">' + esc(r[0]) + '</span>' +
        '<span class="ds">' + esc(r[4]) + '</span></span>' +
        '<span class="item-r"><span>' + esc(r[1]) + '</span>' +
        '<span>' + esc(r[2]) + '</span><span>' + esc(r[3]) + '</span></span>';
      w.appendChild(a);
    });
    feed.appendChild(w);
  }
  function renderExp(){
    var w = document.createElement('div'); w.className = 'list';
    EXP.forEach(function(e){
      var d = document.createElement('div'); d.className = 'node';
      d.innerHTML = '<span><span class="node-co">' + esc(e[0]) + '</span>' +
        '<span class="node-role">' + e[1] + '</span></span>' +
        '<span class="node-when">' + esc(e[2]) + '</span>';
      w.appendChild(d);
    });
    feed.appendChild(w);
  }
  function renderOSS(){
    var w = document.createElement('div'); w.className = 'list';
    OSS.forEach(function(o){
      var d = document.createElement('div'); d.className = 'item';
      d.style.cursor = 'default';
      d.innerHTML = '<span><span class="nm">' + esc(o[0]) + '</span>' +
        '<span class="ds">' + esc(o[1]) + '</span></span>' +
        '<span class="item-r"><span class="tag ' + o[2] + '">' + esc(o[3]) + '</span></span>';
      w.appendChild(d);
    });
    feed.appendChild(w);
  }
  function renderLangs(){
    var w = document.createElement('div'); w.className = 'bars';
    LANGS.forEach(function(L, li){
      var cells = 12, on = Math.round(L[1] / 100 * cells), t = '', i;
      for(i = 0; i < cells; i++){
        t += '<i class="' + (i < on ? 'on' + (li % 2 ? ' alt' : '') : '') + '"></i>';
      }
      var d = document.createElement('div'); d.className = 'bar-row';
      d.innerHTML = '<span class="bar-name">' + esc(L[0]) + '</span>' +
        '<span class="bar-track">' + t + '</span>' +
        '<span class="bar-pct">' + L[1] + '%</span>';
      w.appendChild(d);
    });
    feed.appendChild(w);
  }
  function renderContact(){
    var w = document.createElement('div'); w.className = 'links';
    LINKS.forEach(function(L){
      var a = document.createElement('a');
      a.className = 'lk'; a.href = L[1];
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = L[0];
      w.appendChild(a);
    });
    feed.appendChild(w);
  }

  /* ══ 命令 ══ */
  var CMDS = {
    help: function(){
      text(['● 可用命令',
            '～',
            '· help              这份帮助',
            '· whoami            身份',
            '· ls projects       精选项目（6）',
            '· cat experience    工作与实习',
            '· cat oss           开源与奖项',
            '· tokei             语言构成',
            '· contact           联系方式',
            '· clear             清屏',
            '· dark / light      切昼夜（T 亦可）',
            '· quiet             静默（也可按 S）',
            '～',
            '○ Tab 补全 · ↑↓ 翻历史 · T 昼夜 · S 静默 · / 聚焦'].join('\n'));
    },
    whoami: function(){
      text(['● LofiSu',
            '· AI Full-Stack Engineer · Agentic Infra',
            '· @ByteDance · Chengdu → BeiJing · China',
            '· 1.4k followers · 44 following · 73 public repos'].join('\n'));
    },
    ls: function(){ text('● 精选项目'); renderRepos(); },
    cat: function(arg){
      if(arg === 'experience'){ text('● 工作与实习经历'); renderExp(); return; }
      if(arg === 'oss'){ text('● 开源贡献与奖项'); renderOSS(); return; }
      text('～ cat: ' + (arg || '') + ': 没有这个文件。试试 experience 或 oss');
    },
    tokei: function(){ text('● 语言构成 · 73 个公开仓库'); renderLangs(); },
    contact: function(){ text('● 联系方式'); renderContact(); },
    dark: function(){ setMode('dark', true); },
    light: function(){ setMode('light', true); },
    clear: function(){
      var keep = feed.firstElementChild;
      feed.innerHTML = '';
      if(keep) feed.appendChild(keep);
    },
    quiet: function(){ setQuiet(!quiet); },
    echo: function(a){ text(esc(a) || '&nbsp;'); }
  };
  var ALIASES = {
    ll:'ls', dir:'ls', repos:'ls',
    about:'whoami', me:'whoami',
    skills:'tokei', langs:'tokei',
    mail:'contact', links:'contact',
    night:'dark', day:'light', ye:'dark'
  };
  function complete(w){ return Object.keys(CMDS).filter(function(c){ return c.indexOf(w) === 0; }); }

  /* ══ 静默 ══ */
  var quiet = false;
  function setQuiet(v){
    quiet = v;
    document.body.classList.toggle('quiet', quiet);
    text(quiet ? '○ 静默 · 界面收起，只留终端' : '○ 静默 · OFF');
  }

  /* ══ 执行 ══ */
  var history = [], hIdx = -1;
  function run(raw){
    var cmd = String(raw || '').trim();
    echo(cmd);
    if(!cmd) return;
    history.push(cmd); hIdx = history.length;
    status.textContent = cmd;

    var parts = cmd.split(/\s+/);
    var name = parts[0].toLowerCase();
    var arg = parts.slice(1).join(' ');
    var key = CMDS[name] ? name : ALIASES[name];

    if(name === 'sudo'){ text('～ 这里没有 root，只有一份履历。'); }
    else if(name === 'rm' && /-rf/.test(arg)){ text('～ 不动。'); }
    else if(name === 'cd'){ text('～ cd: ' + (arg || '~') + ': 只有一层目录。'); }
    else if(key){ CMDS[key](arg); }
    else { text(['～ zsh: command not found: ' + name, '～ 输入 help'].join('\n')); }
    blank();
    scrollDown();
  }
  function scrollDown(){
    var r = screenEl.getBoundingClientRect();
    if(r.bottom > innerHeight){
      screenEl.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'end'});
    }
  }

  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ run(input.value); input.value = ''; hIdx = history.length; return; }
    if(e.key === 'ArrowUp'){
      if(!history.length) return;
      hIdx = Math.max(0, hIdx - 1); input.value = history[hIdx] || '';
      e.preventDefault(); return;
    }
    if(e.key === 'ArrowDown'){
      if(!history.length) return;
      hIdx = Math.min(history.length, hIdx + 1); input.value = history[hIdx] || '';
      e.preventDefault(); return;
    }
    if(e.key === 'Tab'){
      e.preventDefault();
      var v = input.value.trim(); if(!v) return;
      var hits = complete(v.split(/\s+/)[0]);
      if(hits.length === 1){ input.value = hits[0] + (hits[0]==='cat'||hits[0]==='ls' ? ' ' : ''); }
      else if(hits.length > 1){ text('～ ' + hits.join('   ')); scrollDown(); }
      return;
    }
    if(e.key === 'l' && e.ctrlKey){ e.preventDefault(); CMDS.clear(); }
  });

  document.getElementById('hints').addEventListener('click', function(e){
    var b = e.target.closest('.hint'); if(!b) return;
    run(b.getAttribute('data-cmd')); input.focus();
  });

  /* 标题栏 */
  document.getElementById('tbBox').addEventListener('click', function(){ setQuiet(!quiet); });
  document.getElementById('tbTheme').addEventListener('click', function(){ toggleMode(); });
  document.getElementById('tbTop').addEventListener('click', function(){ scrollTo({top:0,behavior: reduce?'auto':'smooth'}); });
  document.getElementById('tbBot').addEventListener('click', function(){ scrollTo({top:document.body.scrollHeight,behavior: reduce?'auto':'smooth'}); });

  /* 全局键 */
  document.addEventListener('keydown', function(e){
    if(e.target === input) return;
    if(e.key === 't' || e.key === 'T'){ toggleMode(); }
    if(e.key === 's' || e.key === 'S'){ setQuiet(!quiet); }
    if(e.key === '/'){ e.preventDefault(); input.focus(); }
  });

  /* ══ 石灯笼 ══ */
  var lantern = document.getElementById('lantern');
  var bubbleTimer = null;
  function say(t){
    bubble.textContent = t;
    bubble.classList.add('on');
    var r = lantern.getBoundingClientRect();
    var bw = Math.max(52, bubble.offsetWidth || 70);
    var left = Math.min(Math.max(8, r.left + r.width/2 - bw/2), innerWidth - bw - 8);
    bubble.style.left = left + 'px';
    bubble.style.top = Math.max(8, r.top - 34) + 'px';
    if(bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function(){ bubble.classList.remove('on'); }, 2200);
  }
  lantern.addEventListener('click', function(){
    say(WORDS[Math.floor(Math.random() * WORDS.length)]);
  });

  /* ══ toast ══ */
  var toastTimer = null;
  function toast(t){
    toastEl.textContent = t;
    toastEl.classList.add('on');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2600);
  }

  /* ══ 一炷香 ══ */
  function onScroll(){
    var h = document.documentElement.scrollHeight - innerHeight;
    var p = h > 0 ? (scrollY / h) * 100 : 0;
    bar.style.height = Math.min(100, Math.max(0, p)) + '%';
  }
  addEventListener('scroll', onScroll, {passive:true});
  addEventListener('resize', onScroll, {passive:true});
  onScroll();

  /* ══ 开场：先取 data.json，再打欢迎语 ══ */
  window.addEventListener('load', function(){
    boot().then(function(ok){
      if(!ok) return;                       /* 载入失败时错误提示已经打过了 */
      setTimeout(function(){
        text(['● ' + (P.name || 'LofiSu') + ' — ' + (P.bio && P.bio[1] ? P.bio[1].replace(/<[^>]+>/g, '') : 'AI Full-Stack Engineer'),
              '· 输入 help 看命令，或点下面的按钮',
              '～ Tab 补全 · ↑↓ 翻历史 · T 昼夜 · S 静默'].join('\n'));
        blank();
        toast('敲 help 开始 · T 切昼夜 · 右下角有一盏灯');
        if(!reduce) input.focus({preventScroll:true});
      }, 380);
    });
  });
})();
</script>
</body>
</html>
