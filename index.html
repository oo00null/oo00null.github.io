}

}
.tb-box{
  width:13px;height:13px;flex-shrink:0;position:relative;z-index:1;

<script>
(function(){
  'use strict';

  var root    = document.documentElement;
  var feed    = document.getElementById('feed');
  var input   = document.getElementById('cmd');
  var screenEl= document.getElementById('screen');
  var status  = document.getElementById('stCmd');
  var stMode  = document.getElementById('stMode');
  var toastEl = document.getElementById('toast');
  var bubble  = document.getElementById('bubble');
  var bar     = document.getElementById('incenseBar');
  var reduce  = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mqDark  = matchMedia('(prefers-color-scheme: dark)');

  var PS1 = '<span class="ps1">LofiSu@<span class="host">macbook</span><span class="sym">:~$</span></span> ';

  /* 鈺愨晲 鏄煎 鈺愨晲 */
  var DAYNAME = { light:'鏄?, dark:'澶? };
  try{ var saved = localStorage.getItem('theme'); if(saved==='light'||saved==='dark') root.setAttribute('data-theme', saved); }catch(e){}
  function mode(){ return root.getAttribute('data-theme') || (mqDark.matches ? 'dark' : 'light'); }
  function paintMode(){ stMode.textContent = DAYNAME[mode()]; }
  function setMode(m, announce){
    root.setAttribute('data-theme', m);
    try{ localStorage.setItem('theme', m); }catch(e){}
    paintMode();
    if(announce) text(m === 'dark' ? '鈼?澶?路 澧ㄥ簳鏈堢櫧' : '鈼?鏄?路 鍜岀焊澧ㄥ瓧');
  }
  function toggleMode(){ setMode(mode() === 'dark' ? 'light' : 'dark', true); }
  mqDark.addEventListener('change', paintMode);
  paintMode();

  /* 鈺愨晲 杈撳嚭 鈺愨晲 */
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function push(html){
    var d = document.createElement('div');
    d.className = 'ln';
    d.innerHTML = html;
    feed.appendChild(d);
    return d;
  }
  function echo(cmd){ push(PS1 + '<span class="cmd">' + esc(cmd) + '</span>'); }
  function out(html){ push('<span class="out">' + html + '</span>'); }
  function blank(){ push('&nbsp;'); }

  function paint(t){
    return t.split('\n').map(function(l){
      var s = esc(l);
      if(/^鈼?.test(l)) return '<span class="o-ink">' + s + '</span>';
      if(/^鈼?.test(l)) return '<span class="o-moss">' + s + '</span>';
      if(/^[锝?]/.test(l)) return '<span class="o-faint">' + s + '</span>';
      return '<span class="o-dim">' + s + '</span>';
    }).join('\n');
  }
  function text(t){ out(paint(t).replace(/\n/g,'<br>')); }

  /* 鈺愨晲 鍐呭锛氬叏閮ㄦ潵鑷?data.json 鈺愨晲 */
  var REPOS = [], EXP = [], OSS = [], LANGS = [], LINKS = [], P = {};

  function esc2(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  }); }

  /* 鐢?JSON 濉ご閮ㄦ枃瀛椾笌鍚勫尯鍧楁暟鎹?*/
  function fill(d){
    P = d.profile || {};
    REPOS = d.repos || [];
    EXP   = d.experience || [];
    OSS   = d.oss || [];
    LANGS = d.langs || [];
    LINKS = d.links || [];

    var set = function(sel, html){ var el = document.querySelector(sel); if(el) el.innerHTML = html; };

    if(P.windowTitle) { var t = document.getElementById('tbTitle'); if(t) t.textContent = P.windowTitle; }
    if(P.host){ var h = document.querySelectorAll('.ps1 .host'); for(var i=0;i<h.length;i++) h[i].textContent = P.host; }

    var nm = document.querySelector('.head-name');
    if(nm) nm.innerHTML = esc2(P.name || '') + ' <span class="at">' + esc2(P.handle || '') + '</span>';

    var bios = P.bio || [];
    var bioBox = document.querySelector('.head-bio');
    if(bioBox){
      bioBox.innerHTML = bios.map(function(l, i){
        var last = (i === bios.length - 1);
        return '<div class="head-line"' + (last ? '' : '') + '>' + l + '</div>';
      }).join('') + (P.stats ? '<div class="head-line" style="margin-top:10px">' + P.stats + '</div>' : '');
    }

    if(P.placeholder){ var inp = document.getElementById('cmd'); if(inp) inp.placeholder = P.placeholder; }
    set('#stRight', esc2(P.statusRight || ''));

    var words = P.spirit;
    if(words && words.length){ WORDS = words; }
  }

  /* 杞藉叆銆俧ile:// 涓嬩細琚祻瑙堝櫒鎷︼紝缁欎竴鏉℃槑纭彁绀?*/
  function boot(){
    return fetch('data.json', {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(d){ fill(d); return true; })
      .catch(function(err){
        var isFile = location.protocol === 'file:';
        text([
          '鈼?鍐呭娌¤杩涙潵锛? + (err && err.message ? err.message : '鏈煡閿欒'),
          '锝?,
          isFile
            ? '路 浣犳槸鐩存帴鍙屽嚮鎵撳紑鐨勫惂銆傛祻瑙堝櫒涓嶅厑璁?file:// 椤甸潰璇诲彇 data.json锛堣法婧愰檺鍒讹級銆?
            : '路 data.json 鍜?index.html 瑕佸湪鍚屼竴灞傜洰褰曪紝涓旀枃浠跺悕蹇呴』鏄皬鍐?data.json銆?,
          isFile
            ? '路 鍙屽嚮鐩綍閲岀殑 serve.bat 灏辫兘姝ｅ父鏄剧ず锛涙垨鑰呯敤 VS Code 鐨?Live Server 鎵撳紑銆?
            : '路 鍒锋柊閲嶈瘯涓€娆°€?
        ].join('\n'));
        blank();
        screenEl.scrollIntoView({block:'end'});
        return false;
      });
  }

  var _FALLBACK = null;
  var WORDS = ['闈?,'涓€鎭?,'灞变笉璇?,'姘磋嚜娴?,'鏉鹃','鏃犱簨','浣欑櫧','闁?,'鏈?,'澶滈暦'];

  function renderRepos(){
    var w = document.createElement('div'); w.className = 'list';
    REPOS.forEach(function(r){
      var a = document.createElement('a');
      a.className = 'item';
      a.href = 'https://github.com/LofiSu/' + r[0];
      a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<span><span class="nm">' + esc(r[0]) + '</span>' +
        '<span class="ds">' + esc(r[4]) + '</span></span>' +
        '<span class="item-r"><span>' + esc(r[1]) + '</span>' +
        '<span>' + esc(r[2]) + '</span><span>' + esc(r[3]) + '</span></span>';
      w.appendChild(a);
    });
    feed.appendChild(w);
  }
  function renderExp(){
    var w = document.createElement('div'); w.className = 'list';
    EXP.forEach(function(e){
      var d = document.createElement('div'); d.className = 'node';
      d.innerHTML = '<span><span class="node-co">' + esc(e[0]) + '</span>' +
        '<span class="node-role">' + e[1] + '</span></span>' +
        '<span class="node-when">' + esc(e[2]) + '</span>';
      w.appendChild(d);
    });
    feed.appendChild(w);
  }
  function renderOSS(){
    var w = document.createElement('div'); w.className = 'list';
    OSS.forEach(function(o){
      var d = document.createElement('div'); d.className = 'item';
      d.style.cursor = 'default';
      d.innerHTML = '<span><span class="nm">' + esc(o[0]) + '</span>' +
        '<span class="ds">' + esc(o[1]) + '</span></span>' +
        '<span class="item-r"><span class="tag ' + o[2] + '">' + esc(o[3]) + '</span></span>';
      w.appendChild(d);
    });
    feed.appendChild(w);
  }
  function renderLangs(){
    var w = document.createElement('div'); w.className = 'bars';
    LANGS.forEach(function(L, li){
      var cells = 12, on = Math.round(L[1] / 100 * cells), t = '', i;
      for(i = 0; i < cells; i++){
        t += '<i class="' + (i < on ? 'on' + (li % 2 ? ' alt' : '') : '') + '"></i>';
      }
      var d = document.createElement('div'); d.className = 'bar-row';
      d.innerHTML = '<span class="bar-name">' + esc(L[0]) + '</span>' +
        '<span class="bar-track">' + t + '</span>' +
        '<span class="bar-pct">' + L[1] + '%</span>';
      w.appendChild(d);
    });
    feed.appendChild(w);
  }
  function renderContact(){
    var w = document.createElement('div'); w.className = 'links';
    LINKS.forEach(function(L){
      var a = document.createElement('a');
      a.className = 'lk'; a.href = L[1];
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = L[0];
      w.appendChild(a);
    });
    feed.appendChild(w);
  }

  /* 鈺愨晲 鍛戒护 鈺愨晲 */
  var CMDS = {
    help: function(){
      text(['鈼?鍙敤鍛戒护',
            '锝?,
            '路 help              杩欎唤甯姪',
            '路 whoami            韬唤',
            '路 ls projects       绮鹃€夐」鐩紙6锛?,
            '路 cat experience    宸ヤ綔涓庡疄涔?,
            '路 cat oss           寮€婧愪笌濂栭」',
            '路 tokei             璇█鏋勬垚',
            '路 contact           鑱旂郴鏂瑰紡',
            '路 clear             娓呭睆',
            '路 dark / light      鍒囨樇澶滐紙T 浜﹀彲锛?,
            '路 quiet             闈欓粯锛堜篃鍙寜 S锛?,
            '锝?,
            '鈼?Tab 琛ュ叏 路 鈫戔啌 缈诲巻鍙?路 T 鏄煎 路 S 闈欓粯 路 / 鑱氱劍'].join('\n'));
    },
    whoami: function(){
      text(['鈼?LofiSu',
            '路 AI Full-Stack Engineer 路 Agentic Infra',
            '路 @ByteDance 路 Chengdu 鈫?BeiJing 路 China',
            '路 1.4k followers 路 44 following 路 73 public repos'].join('\n'));
    },
    ls: function(){ text('鈼?绮鹃€夐」鐩?); renderRepos(); },
    cat: function(arg){
      if(arg === 'experience'){ text('鈼?宸ヤ綔涓庡疄涔犵粡鍘?); renderExp(); return; }
      if(arg === 'oss'){ text('鈼?寮€婧愯础鐚笌濂栭」'); renderOSS(); return; }
      text('锝?cat: ' + (arg || '') + ': 娌℃湁杩欎釜鏂囦欢銆傝瘯璇?experience 鎴?oss');
    },
    tokei: function(){ text('鈼?璇█鏋勬垚 路 73 涓叕寮€浠撳簱'); renderLangs(); },
    contact: function(){ text('鈼?鑱旂郴鏂瑰紡'); renderContact(); },
    dark: function(){ setMode('dark', true); },
    light: function(){ setMode('light', true); },
    clear: function(){
      var keep = feed.firstElementChild;
      feed.innerHTML = '';
      if(keep) feed.appendChild(keep);
    },
    quiet: function(){ setQuiet(!quiet); },
    echo: function(a){ text(esc(a) || '&nbsp;'); }
  };
  var ALIASES = {
    ll:'ls', dir:'ls', repos:'ls',
    about:'whoami', me:'whoami',
    skills:'tokei', langs:'tokei',
    mail:'contact', links:'contact',
    night:'dark', day:'light', ye:'dark'
  };
  function complete(w){ return Object.keys(CMDS).filter(function(c){ return c.indexOf(w) === 0; }); }

  /* 鈺愨晲 闈欓粯 鈺愨晲 */
  var quiet = false;
  function setQuiet(v){
    quiet = v;
    document.body.classList.toggle('quiet', quiet);
    text(quiet ? '鈼?闈欓粯 路 鐣岄潰鏀惰捣锛屽彧鐣欑粓绔? : '鈼?闈欓粯 路 OFF');
  }

  /* 鈺愨晲 鎵ц 鈺愨晲 */
  var history = [], hIdx = -1;
  function run(raw){
    var cmd = String(raw || '').trim();
    echo(cmd);
    if(!cmd) return;
    history.push(cmd); hIdx = history.length;
    status.textContent = cmd;

    var parts = cmd.split(/\s+/);
    var name = parts[0].toLowerCase();
    var arg = parts.slice(1).join(' ');
    var key = CMDS[name] ? name : ALIASES[name];

    if(name === 'sudo'){ text('锝?杩欓噷娌℃湁 root锛屽彧鏈変竴浠藉饱鍘嗐€?); }
    else if(name === 'rm' && /-rf/.test(arg)){ text('锝?涓嶅姩銆?); }
    else if(name === 'cd'){ text('锝?cd: ' + (arg || '~') + ': 鍙湁涓€灞傜洰褰曘€?); }
    else if(key){ CMDS[key](arg); }
    else { text(['锝?zsh: command not found: ' + name, '锝?杈撳叆 help'].join('\n')); }
    blank();
    scrollDown();
  }
  function scrollDown(){
    var r = screenEl.getBoundingClientRect();
    if(r.bottom > innerHeight){
      screenEl.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'end'});
    }
  }

  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ run(input.value); input.value = ''; hIdx = history.length; return; }
    if(e.key === 'ArrowUp'){
      if(!history.length) return;
      hIdx = Math.max(0, hIdx - 1); input.value = history[hIdx] || '';
      e.preventDefault(); return;
    }
    if(e.key === 'ArrowDown'){
      if(!history.length) return;
      hIdx = Math.min(history.length, hIdx + 1); input.value = history[hIdx] || '';
      e.preventDefault(); return;
    }
    if(e.key === 'Tab'){
      e.preventDefault();
      var v = input.value.trim(); if(!v) return;
      var hits = complete(v.split(/\s+/)[0]);
      if(hits.length === 1){ input.value = hits[0] + (hits[0]==='cat'||hits[0]==='ls' ? ' ' : ''); }
      else if(hits.length > 1){ text('锝?' + hits.join('   ')); scrollDown(); }
      return;
    }
    if(e.key === 'l' && e.ctrlKey){ e.preventDefault(); CMDS.clear(); }
  });

  document.getElementById('hints').addEventListener('click', function(e){
    var b = e.target.closest('.hint'); if(!b) return;
    run(b.getAttribute('data-cmd')); input.focus();
  });

  /* 鏍囬鏍?*/
  document.getElementById('tbBox').addEventListener('click', function(){ setQuiet(!quiet); });
  document.getElementById('tbTheme').addEventListener('click', function(){ toggleMode(); });
  document.getElementById('tbTop').addEventListener('click', function(){ scrollTo({top:0,behavior: reduce?'auto':'smooth'}); });
  document.getElementById('tbBot').addEventListener('click', function(){ scrollTo({top:document.body.scrollHeight,behavior: reduce?'auto':'smooth'}); });

  /* 鍏ㄥ眬閿?*/
  document.addEventListener('keydown', function(e){
    if(e.target === input) return;
    if(e.key === 't' || e.key === 'T'){ toggleMode(); }
    if(e.key === 's' || e.key === 'S'){ setQuiet(!quiet); }
    if(e.key === '/'){ e.preventDefault(); input.focus(); }
  });

  /* 鈺愨晲 鐭崇伅绗?鈺愨晲 */
  var lantern = document.getElementById('lantern');
  var bubbleTimer = null;
  function say(t){
    bubble.textContent = t;
    bubble.classList.add('on');
    var r = lantern.getBoundingClientRect();
    var bw = Math.max(52, bubble.offsetWidth || 70);
    var left = Math.min(Math.max(8, r.left + r.width/2 - bw/2), innerWidth - bw - 8);
    bubble.style.left = left + 'px';
    bubble.style.top = Math.max(8, r.top - 34) + 'px';
    if(bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function(){ bubble.classList.remove('on'); }, 2200);
  }
  lantern.addEventListener('click', function(){
    say(WORDS[Math.floor(Math.random() * WORDS.length)]);
  });

  /* 鈺愨晲 toast 鈺愨晲 */
  var toastTimer = null;
  function toast(t){
    toastEl.textContent = t;
    toastEl.classList.add('on');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2600);
  }

  /* 鈺愨晲 涓€鐐烽 鈺愨晲 */
  function onScroll(){
    var h = document.documentElement.scrollHeight - innerHeight;
    var p = h > 0 ? (scrollY / h) * 100 : 0;
    bar.style.height = Math.min(100, Math.max(0, p)) + '%';
  }
  addEventListener('scroll', onScroll, {passive:true});
  addEventListener('resize', onScroll, {passive:true});
  onScroll();

  /* 鈺愨晲 寮€鍦猴細鍏堝彇 data.json锛屽啀鎵撴杩庤 鈺愨晲 */
  window.addEventListener('load', function(){
    boot().then(function(ok){
